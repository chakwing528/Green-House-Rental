<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>極速物資點名系統</title>
  
  <!-- ================= 加入主畫面 (PWA/iOS) 設定 ================= -->
  <!-- 1. 設定 iPhone 桌面圖示 (請確保 icon.jpg 已上傳至 GitHub) -->
  <link rel="apple-touch-icon" href="icon.PNG">
  <link rel="icon" href="icon.PNG">
  
  <!-- 2. 讓 App 加入主畫面後名稱更簡短 -->
  <meta name="apple-mobile-web-app-title" content="物資點名">
  
  <!-- 3. 隱藏 Safari 網址列，變成全螢幕 App 模式 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <!-- 4. 設定頂部狀態列的顏色 (讓手機最上面的時間、電量顯示變白色) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2563EB"> <!-- 對應藍色 header -->
  
  <!-- 為了確保手機上的比例正確 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- ========================================================= -->
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .loader { border: 5px solid #f3f3f3; border-top: 5px solid #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    /* 點擊反饋優化 */
    button:active { transform: scale(0.96); transition: transform 0.1s; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

  <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex flex-col items-center justify-center">
    <div class="loader mb-4"></div>
    <p class="text-white text-lg font-bold tracking-wider">首次載入全校資料中...</p>
  </div>

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-10">
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-40 flex items-center shadow-md">
      <button id="backBtn" class="hidden text-xl mr-4" onclick="goBack()"><i class="fas fa-chevron-left"></i></button>
      <h1 id="pageTitle" class="text-xl font-bold flex-1 text-center">儀表板</h1>
      <div class="w-6"></div> 
    </header>

    <main class="p-4">
      
      <!-- View: Dashboard -->
      <div id="view-dashboard" class="view-section">
        <button onclick="startBorrowFlow()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-6 rounded-2xl shadow-lg text-2xl mb-8">
          <i class="fas fa-plus-circle mr-2"></i> 新增租借
        </button>

        <h2 class="text-lg font-bold text-gray-700 mb-3 border-b-2 border-blue-500 pb-1"><i class="fas fa-running text-blue-500 mr-2"></i>正在租借榜</h2>
        <div id="activeList" class="space-y-3 mb-8"></div>

        <h2 class="text-lg font-bold text-gray-700 mb-3 border-b-2 border-gray-400 pb-1"><i class="fas fa-history text-gray-500 mr-2"></i>近期歸還紀錄</h2>
        <div id="historyList" class="space-y-2 opacity-80"></div>
      </div>

      <!-- View: Step 1 -->
      <div id="view-step1" class="view-section hidden">
        <div class="text-center mb-6 text-gray-600">請選擇學生所在班別</div>
        <div id="classList" class="grid grid-cols-3 gap-3"></div>
      </div>

      <!-- View: Step 2 -->
      <div id="view-step2" class="view-section hidden">
        <div class="text-center mb-6 text-gray-600">請選擇 <span id="displaySelectedClass" class="font-bold text-blue-600"></span> 班學號</div>
        <div id="numList" class="grid grid-cols-4 gap-2"></div>
      </div>

      <!-- View: Step 3 -->
      <div id="view-step3" class="view-section hidden">
        <div id="stuCard" class="p-5 rounded-xl border mb-8 shadow-sm">
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm opacity-60">學生身分</span>
            <span id="stuHouse" class="text-xs px-2 py-1 rounded font-bold"></span>
          </div>
          <h3 class="text-2xl font-bold"><span id="stuClassNum"></span> <span id="stuName"></span></h3>
        </div>

        <div class="text-center mb-4 text-gray-600 font-bold">請選擇欲租借的物品 / 項目</div>
        <div class="grid grid-cols-1 gap-4">
          <button onclick="selectItem('釘鞋')" class="bg-orange-500 text-white font-bold py-8 rounded-2xl shadow-md text-2xl">
            <i class="fas fa-shoe-prints mr-2"></i> 釘鞋
          </button>
          <button onclick="selectItem('洗手間')" class="bg-cyan-500 text-white font-bold py-8 rounded-2xl shadow-md text-2xl">
            <i class="fas fa-restroom mr-2"></i> 洗手間
          </button>
        </div>
      </div>

      <!-- View: Step 3b - 尺碼選擇 -->
      <div id="view-step3b" class="view-section hidden">
        <div id="stuCard2" class="p-5 rounded-xl border mb-8 shadow-sm">
          <div class="flex justify-between items-center mb-2">
            <span class="text-sm opacity-60">學生身分</span>
            <span id="stuHouse2" class="text-xs px-2 py-1 rounded font-bold"></span>
          </div>
          <h3 class="text-2xl font-bold"><span id="stuClassNum2"></span> <span id="stuName2"></span></h3>
        </div>
        <div class="text-center mb-4 text-gray-600 font-bold">請選擇釘鞋尺碼</div>
        <div class="grid grid-cols-4 gap-3">
          <button onclick="selectSize(36)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">36</button>
          <button onclick="selectSize(37)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">37</button>
          <button onclick="selectSize(38)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">38</button>
          <button onclick="selectSize(39)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">39</button>
          <button onclick="selectSize(40)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">40</button>
          <button onclick="selectSize(41)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">41</button>
          <button onclick="selectSize(42)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">42</button>
          <button onclick="selectSize(43)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">43</button>
          <button onclick="selectSize(44)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">44</button>
          <button onclick="selectSize(45)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">45</button>
          <button onclick="selectSize(46)" class="bg-orange-100 hover:bg-orange-200 text-orange-800 font-bold py-4 rounded-xl shadow-sm text-xl">46</button>
        </div>
      </div>

      <!-- View: Step 4 -->
      <div id="view-step4" class="view-section hidden">
        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
          <p class="font-bold text-yellow-800 text-lg mb-2">請確認以下資訊</p>
          <p class="text-gray-700"><strong>班別：</strong> <span id="confirmClass"></span></p>
          <p class="text-gray-700"><strong>學號：</strong> <span id="confirmNum"></span></p>
          <p class="text-gray-700"><strong>姓名：</strong> <span id="confirmName"></span></p>
          <p class="text-gray-700"><strong>物品：</strong> <span id="confirmItem" class="text-xl font-bold text-red-600"></span></p>
        </div>
        <button onclick="submitBorrow()" class="w-full bg-green-500 text-white font-bold py-5 rounded-2xl shadow-lg text-xl mb-4">
          <i class="fas fa-check-circle mr-2"></i> 確認送出
        </button>
        <button onclick="cancelBorrow()" class="w-full bg-gray-300 text-gray-700 font-bold py-4 rounded-2xl text-lg">
          取消
        </button>
      </div>

    </main>
  </div>

  <script>
    // 你的專屬 GAS URL
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbyO6J_2phrFWUntA-c2ysq_gDFyfCA83KVkzeVWoqMB8KYb_Y2rIjsaaaf0qSbZFqzu-w/exec';

    let _activeRecords = [];

    const state = {
      viewStack: ['view-dashboard'],
      currentStudent: { classNum: '', studentNum: '', name: '', house: '', item: '', borrowTime: '' },
      classes: ['1A','1B','1C','2A','2B','2C','3A','3B','3C','4A','4B','5A','5B','5C'],
      dataCache: { active: [], history: [], students: {} } // 全域快取記憶體
    };

    // 取得當下時間 (格式: yyyy/MM/dd HH:mm:ss)
    function getFormattedTime() {
      const now = new Date();
      return `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    }

    window.onload = function() {
      initClassButtons();
      loadInitialData(); // 初始載入一次全校資料
    };

    function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
    function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }
    
    function switchView(viewId, title) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
      document.getElementById('pageTitle').innerText = title;
      
      const backBtn = document.getElementById('backBtn');
      if (viewId === 'view-dashboard') {
        backBtn.classList.add('hidden');
        state.viewStack = ['view-dashboard']; 
      } else {
        backBtn.classList.remove('hidden');
        if (state.viewStack[state.viewStack.length - 1] !== viewId) {
          state.viewStack.push(viewId);
        }
      }
    }

    function goBack() {
      if (state.viewStack.length > 1) {
        state.viewStack.pop(); 
        const prevView = state.viewStack.pop(); 
        let title = '系統';
        if(prevView === 'view-dashboard') title = '儀表板';
        else if(prevView === 'view-step1') title = '選擇班別';
        else if(prevView === 'view-step2') title = '選擇學號';
        else if(prevView === 'view-step3') title = '選擇物品';
        else if(prevView === 'view-step3b') title = '選擇尺碼';
        else if(prevView === 'view-step4') title = '確認租借';
        switchView(prevView, title);
      }
    }

    // --- 首次全量載入 ---
    function loadInitialData() {
      showLoading();
      fetch(`${GAS_API_URL}?action=getInitialData`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            state.dataCache = res.data; // 存入記憶體
            renderDashboard();
            hideLoading();
            startPolling();
          } else throw new Error(res.message);
        })
        .catch(err => { alert('載入失敗，請重整網頁。' + err.message); hideLoading(); });
    }

    // --- 渲染畫面從「本地快取」讀取，0 延遲 ---
    function renderDashboard() {
      const activeList = document.getElementById('activeList');
      const historyList = document.getElementById('historyList');
      const activeData = state.dataCache.active;
      const historyData = state.dataCache.history;
      
      _activeRecords = activeData;
      if (activeData.length === 0) {
        activeList.innerHTML = '<p class="text-center text-gray-400 py-4">目前沒有租借紀錄</p>';
      } else {
        activeList.innerHTML = activeData.map((record, index) => {
          const h = record.house || '';
          let cardCls, textCls, itemCls, timeCls, btnCls;
          if (h.includes('紅'))      { cardCls='bg-red-500 border-red-700';    textCls='text-white'; itemCls='bg-white text-red-600';   timeCls='text-red-100';   btnCls='bg-white text-red-600 hover:bg-red-50'; }
          else if (h.includes('黃')) { cardCls='bg-yellow-400 border-yellow-600'; textCls='text-gray-900'; itemCls='bg-white text-yellow-700'; timeCls='text-yellow-800'; btnCls='bg-white text-yellow-700 hover:bg-yellow-50'; }
          else if (h.includes('藍')) { cardCls='bg-blue-600 border-blue-800';   textCls='text-white'; itemCls='bg-white text-blue-700';   timeCls='text-blue-100';  btnCls='bg-white text-blue-600 hover:bg-blue-50'; }
          else if (h.includes('綠')) { cardCls='bg-green-500 border-green-700'; textCls='text-white'; itemCls='bg-white text-green-700'; timeCls='text-green-100'; btnCls='bg-white text-green-600 hover:bg-green-50'; }
          else                       { cardCls='bg-white border-gray-300';      textCls='text-gray-800'; itemCls='bg-gray-100 text-red-600'; timeCls='text-gray-500'; btnCls='bg-blue-100 text-blue-700 hover:bg-blue-200'; }
          return `
          <div class="border-2 ${cardCls} p-4 rounded-xl shadow-sm flex justify-between items-center">
            <div>
              <div class="font-bold text-lg ${textCls}">${record.classNum} (${record.studentNum}) ${record.name}</div>
              <div class="text-sm mt-1 flex items-center gap-2">
                <span class="${itemCls} px-2 py-0.5 rounded font-semibold text-xs">${record.item}</span>
                <span class="${timeCls}"><i class="far fa-clock mr-1"></i>${record.borrowTime.split(' ')[1]}</span>
              </div>
            </div>
            <button onclick="confirmReturn(${index})" class="${btnCls} px-4 py-3 rounded-xl font-bold shadow-sm active:scale-95 transition">
              歸還
            </button>
          </div>`;
        }).join('');
      }

      if (historyData.length === 0) {
        historyList.innerHTML = '<p class="text-center text-gray-400 py-4">暫無歷史紀錄</p>';
      } else {
        historyList.innerHTML = historyData.slice(0, 30).map(record => `
          <div class="bg-gray-50 p-3 rounded border border-gray-100 flex justify-between items-center text-sm">
            <div>
              <span class="font-bold text-gray-700">${record.classNum} ${record.name}</span> 
              借用 <span class="text-gray-600">${record.item}</span>
            </div>
            <div class="text-gray-400 text-xs">${record.returnTime ? record.returnTime.split(' ')[1] : ''} 還</div>
          </div>
        `).join('');
      }
    }

    // --- 樂觀更新：0秒歸還 ---
    function confirmReturn(index) {
      const record = _activeRecords[index];
      if(confirm(`確定要將 ${record.classNum} ${record.name} 的「${record.item}」設為已歸還嗎？`)) {
        
        // 1. 生成歸還時間
        record.returnTime = getFormattedTime();

        // 2. 本地端瞬間修改陣列
        state.dataCache.active = state.dataCache.active.filter(r => !(r.classNum === record.classNum && r.studentNum === record.studentNum && r.item === record.item && r.borrowTime === record.borrowTime));
        state.dataCache.history.unshift(record); // 加到歷史紀錄最上面
        
        // 3. 瞬間更新畫面 (不需 loading)
        renderDashboard();

        // 4. 背景非同步送出資料給 GAS
        fetch(GAS_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ action: 'returnItem', data: record })
        }).catch(err => alert('背景歸還同步失敗，請檢查網路！'));
      }
    }

    function startBorrowFlow() {
      state.currentStudent = { classNum: '', studentNum: '', name: '', house: '', item: '', borrowTime: '' };
      switchView('view-step1', '選擇班別');
    }

    function initClassButtons() {
      const container = document.getElementById('classList');
      container.innerHTML = state.classes.map(c => 
        `<button onclick="selectClass('${c}')" class="bg-white border border-gray-300 text-gray-700 font-bold py-4 rounded-xl shadow-sm text-xl">${c}</button>`
      ).join('');
    }

    // 0秒選班級 (從快取讀)
    function selectClass(c) {
      state.currentStudent.classNum = c;
      document.getElementById('displaySelectedClass').innerText = c;
      
      const classData = state.dataCache.students[c] || {};
      const numbers = Object.keys(classData).map(Number).sort((a,b)=>a-b);
      
      const container = document.getElementById('numList');
      if (numbers.length === 0) {
        container.innerHTML = '<div class="col-span-4 text-center text-gray-500 py-4">此班級尚無學生資料</div>';
      } else {
        container.innerHTML = numbers.map(n => 
          `<button onclick="selectNum(${n})" class="bg-white border border-gray-200 text-gray-700 font-semibold py-3 rounded-lg shadow-sm text-lg">${n}</button>`
        ).join('');
      }
      switchView('view-step2', '選擇學號');
    }

    // 0秒選學號 (從快取讀)
    function selectNum(n) {
      state.currentStudent.studentNum = n;
      const studentData = state.dataCache.students[state.currentStudent.classNum][n];
      
      state.currentStudent.name = studentData.name;
      state.currentStudent.house = studentData.house;
      
      document.getElementById('stuClassNum').innerText = `${state.currentStudent.classNum} (${state.currentStudent.studentNum})`;
      document.getElementById('stuName').innerText = state.currentStudent.name;
      
      const houseEl = document.getElementById('stuHouse');
      let houseText = state.currentStudent.house ? state.currentStudent.house : '無';
      if (!houseText.includes('社') && houseText !== '無') houseText += '社';
      houseEl.innerText = houseText;
      
      // 設定社卡顏色 (step3 & step3b 共用同一個 helper)
      applyHouseStyle(houseText);

      switchView('view-step3', '選擇物品');
    }

    // 根據社名套用卡片顏色 (stuCard + stuCard2 + 社badge)
    function applyHouseStyle(houseText) {
      const cards = [document.getElementById('stuCard'), document.getElementById('stuCard2')];
      const badges = [document.getElementById('stuHouse'), document.getElementById('stuHouse2')];

      let cardBg, cardBorder, cardText, badgeBg, badgeText;
      if (houseText.includes('紅'))      { cardBg='bg-red-500';    cardBorder='border-red-700';    cardText='text-white';    badgeBg='bg-white'; badgeText='text-red-600'; }
      else if (houseText.includes('黃')) { cardBg='bg-yellow-400'; cardBorder='border-yellow-600'; cardText='text-gray-900'; badgeBg='bg-white'; badgeText='text-yellow-700'; }
      else if (houseText.includes('藍')) { cardBg='bg-blue-600';   cardBorder='border-blue-800';   cardText='text-white';    badgeBg='bg-white'; badgeText='text-blue-700'; }
      else if (houseText.includes('綠')) { cardBg='bg-green-500';  cardBorder='border-green-700';  cardText='text-white';    badgeBg='bg-white'; badgeText='text-green-700'; }
      else                               { cardBg='bg-gray-200';   cardBorder='border-gray-400';   cardText='text-gray-800'; badgeBg='bg-gray-100'; badgeText='text-gray-700'; }

      cards.forEach(el => { if(el) el.className = `p-5 rounded-xl border-2 mb-8 shadow-md ${cardBg} ${cardBorder} ${cardText}`; });
      badges.forEach(el => { if(el) { el.className = `text-xs px-2 py-1 rounded font-bold ${badgeBg} ${badgeText}`; el.innerText = houseText; } });

      // 同步 stuClassNum2 / stuName2
      const c = document.getElementById('stuClassNum2'), n = document.getElementById('stuName2');
      if(c) c.innerText = document.getElementById('stuClassNum').innerText;
      if(n) n.innerText = document.getElementById('stuName').innerText;
    }

    function selectItem(item) {
      state.currentStudent.item = item;
      if (item === '釘鞋') {
        switchView('view-step3b', '選擇尺碼');
      } else {
        goToConfirm();
      }
    }

    function selectSize(size) {
      state.currentStudent.item = `釘鞋 (${size})`;
      goToConfirm();
    }

    function goToConfirm() {
      document.getElementById('confirmClass').innerText = state.currentStudent.classNum;
      document.getElementById('confirmNum').innerText = state.currentStudent.studentNum;
      document.getElementById('confirmName').innerText = state.currentStudent.name;
      document.getElementById('confirmItem').innerText = state.currentStudent.item;
      switchView('view-step4', '確認租借');
    }

    // --- 樂觀更新：0秒送出 ---
    function submitBorrow() {
      // 1. 生成寫入時間
      state.currentStudent.borrowTime = getFormattedTime();

      // 2. 本地端瞬間加入陣列 (加到最上方)
      const newRecord = Object.assign({}, state.currentStudent);
      state.dataCache.active.push(newRecord);

      // 3. 瞬間跳回儀表板並更新畫面 (0 秒等待)
      renderDashboard();
      switchView('view-dashboard', '儀表板');

      // 4. 背景非同步送出資料給 GAS
      fetch(GAS_API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ action: 'borrowItem', data: newRecord })
      }).catch(err => alert('背景寫入同步失敗，請檢查網路！'));
    }

    function cancelBorrow() { switchView('view-dashboard', '儀表板'); }

    // --- 每5秒輪詢同步（只讀 Active + History，不重新拉學生名單）---
    function startPolling() {
      setInterval(pollDashboard, 5000);
    }

    function pollDashboard() {
      fetch(`${GAS_API_URL}?action=getActiveData`)
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success') {
            state.dataCache.active = res.data.active;
            state.dataCache.history = res.data.history;
            if (state.viewStack[state.viewStack.length - 1] === 'view-dashboard') {
              renderDashboard();
            }
          }
        })
        .catch(() => {}); // 網絡失敗靜默處理，不影響使用
    }
  </script>
</body>
</html>
